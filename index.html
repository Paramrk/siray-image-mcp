<!doctype html>
<meta charset="utf-8">
<title>Siray Image Generator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --line:#272c36; --ink:#e7e9ee; --dim:#98a0b0; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,Segoe UI,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); font-weight:600; }
  main { display:grid; grid-template-columns:340px 1fr; gap:24px; padding:24px; align-items:start; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  label { display:block; margin:12px 0 4px; color:var(--dim); font-size:12px; }
  label:first-child { margin-top:0; }
  input, select, textarea { width:100%; padding:8px 10px; background:#0e1016; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; font:inherit; }
  textarea { min-height:96px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { width:100%; margin-top:16px; padding:10px; border:0; border-radius:6px;
    background:var(--accent); color:#0b1020; font-weight:600; cursor:pointer; }
  button[disabled] { opacity:.55; cursor:progress; }
  #msg { margin-top:12px; font-size:12px; white-space:pre-wrap; word-break:break-all; color:var(--dim); }
  #msg.err { color:#ff8f8f; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
  #grid a { display:block; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  #grid img { display:block; width:100%; height:180px; object-fit:cover; }
  .empty { color:var(--dim); }
</style>

<header>Siray Image Generator</header>
<main>
  <form class="panel" id="form">
    <label>Prompt</label>
    <textarea name="prompt" required placeholder="a matte black wireless earbud case on a white studio background, soft light"></textarea>

    <label>Model</label>
    <select name="model" id="model"></select>

    <label>Size (exact W x H, optional)</label>
    <input name="size" placeholder="1920x1080">

    <div class="row">
      <div><label>Aspect ratio</label>
        <select name="aspect_ratio">
          <option value="">default (ignored if size is set)</option>
          <option>1:1</option><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option>
        </select>
      </div>
      <div><label>Seed</label><input name="seed" inputmode="numeric" placeholder="random"></div>
    </div>

    <label>Reference image (optional, for image-to-image)</label>
    <input name="image" placeholder="https://... or D:\path\to\image.png">

    <label>Save to (blank = ./output)</label>
    <input name="out_dir" placeholder="D:\Work Project\myproject\public\images">

    <button type="submit">Generate</button>
    <div id="msg"></div>
  </form>

  <div class="panel">
    <div id="grid"><span class="empty">No images yet.</span></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const msg = $("#msg");

fetch("/models").then(r => r.json()).then(d => {
  $("#model").innerHTML = d.models
    .map(m => `<option value="${m}"${m === d.default ? " selected" : ""}>${m}</option>`).join("");
});

async function refresh() {
  const { images } = await (await fetch("/gallery")).json();
  $("#grid").innerHTML = images.length
    ? images.map(u => `<a href="${u}" target="_blank"><img src="${u}" loading="lazy"></a>`).join("")
    : '<span class="empty">No images yet.</span>';
}
refresh();

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "Generating… this can take 10-60s.";
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const res = await fetch("/generate", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    msg.textContent = "Saved:\n" + data.paths.join("\n");
    refresh();
  } catch (err) {
    msg.className = "err";
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
